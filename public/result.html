<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>희귀 답변 챌린지 - 결과</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>게임 결과</h1>

    <div id="summary" hidden>
      <p class="big-score"><span id="totalScore"></span>점</p>
      <p id="gameTier" class="tier"></p>
      <p id="averageText" class="subtitle"></p>
      <ol id="answerList" class="answer-list"></ol>
      <a class="button" href="game.html">다시 하기</a>
      <p><a href="index.html">처음 화면으로</a></p>
    </div>

    <div id="empty" hidden>
      <p>표시할 결과가 없습니다. 먼저 게임을 플레이해 주세요.</p>
      <a class="button" href="game.html">게임 시작</a>
    </div>
  </main>
  <script src="result.js"></script>
</body>
</html>

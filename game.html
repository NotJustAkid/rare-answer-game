
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>희귀 답변 챌린지 - 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div id="game">
      <p class="status">
        <span id="round"></span>
        <span id="timer"></span>
      </p>
      <h2 id="question"></h2>
      <input id="answer" type="text" placeholder="답을 입력하세요" autocomplete="off">
      <button id="submitBtn" class="button">제출</button>
      <p id="feedback" class="feedback"></p>
    </div>

    <div id="finalBox" hidden>
      <h2>게임 끝!</h2>
      <p>총점: <strong id="finalScore"></strong></p>
      <a class="button" href="game.html">다시 하기</a>
      <p><a href="index.html">처음 화면으로</a></p>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>

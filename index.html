<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>희귀 답변 챌린지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>희귀 답변 챌린지</h1>
    <p class="subtitle">남들이 떠올리지 못한 답을 찾아보세요!</p>

    <a class="button" href="game.html">게임 시작</a>

    <section class="howto">
      <h2>게임 방법</h2>
      <ol>
        <li>화면에 주제가 나타납니다.</li>
        <li>제한 시간 안에 답을 하나만 입력하세요.</li>
        <li>많은 사람이 말하지 않은 답일수록 높은 점수를 얻습니다.</li>
        <li>5~7개의 주제가 끝나면 총점을 확인하세요.</li>
      </ol>
    </section>

    <p class="footer">설문 응답 데이터를 기준으로 점수가 계산됩니다.</p>
  </main>

</html>
